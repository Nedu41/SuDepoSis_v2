[env:esp8266-12e]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 9600
upload_speed = 460800

; src/depo/ klasoru eski/yedek kaynak dosyalarini icerir.
; Derlemeye dahil edilirse "multiple definition" baglayici hatasi verir.
build_src_filter = +<*> -<depo/>

lib_deps =
    bblanchon/ArduinoJson @ ^6.19.0
    adafruit/RTClib @ ^2.0.0
; Not: ESP8266WiFi, ESP8266WebServer, ESP8266mDNS, ArduinoOTA
; zaten ESP8266 Arduino Core'un dahili parcasidir, lib_deps'e eklenmez.

; Pin Kullanımı:
; D0(GPIO16)  → MAX485 DI (RS485 TX)
; D1(GPIO5)   → RTC DS1307 SCL
; D2(GPIO4)   → RTC DS1307 SDA
; D3(GPIO2)   → MAX485 DE/RE (RS485 kontrol)
; D5(GPIO14)  → HC-SR04 TRIG
; D6(GPIO12)  → HC-SR04 ECHO
; D7(GPIO13)  → MAX485 RO (RS485 RX)
; D9(GPIO3)   → UART0 RX ← Nano TX (470Ω + 1KΩ)
; D10(GPIO1)  → UART0 TX → Nano RX (470Ω)

; ===== Flash / LittleFS Ayarları =====
; ESP8266 4MB flash - FS (LittleFS) için 2MB ayrılır
; Doğru ayar: board_build.flash_size (board_upload.flash_size DEĞİL!)
; LittleFS.okuma/yazma sorunları genelde yanlış flash boyutu
; veya filesystem tanımı eksikliğinden kaynaklanır.
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_upload.flash_size = 4MB

; Flash: OTA için yer ayrılmalı
board_build.flash_mode = dout
board_build.f_cpu = 80000000L

; ÖNEMLİ: LittleFS imajı yüklemek için:
;   pio run -t uploadfs
; (Çalışma zamanında LittleFS.format() de otomatik oluşturur)

monitor_port = COM3
upload_port = COM3