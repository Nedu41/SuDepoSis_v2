[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_speed = 57600

lib_deps =

; COM PORT:
upload_port = COM14
monitor_port = COM14

; Pin Kullanımı:
; D0 (RX) ← ESP8266 (TX) - Seri haberleşme
; D1 (TX) → ESP8266 (RX) - Seri haberleşme
; D9       → Röle (NC - Normally Closed)
; D10      → Sol Kapı Sensörü (INPUT_PULLUP)
; D11      → Sağ Kapı Sensörü (INPUT_PULLUP)
; D13      → Status LED (built-in)