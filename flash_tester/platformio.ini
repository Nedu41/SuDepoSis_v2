; SPI NOR Flash (SOIC-8) test cihazi - ESP32-WROOM-32UE uzerinde calisir.
; Amac: module lehimlemeden ONCE bir flash cipinin saglam olup olmadigini
; ve kac MB oldugunu JEDEC ID ile kesin olarak ogrenmek.
; ESP32 3.3V logic kullandigi icin flash'a DOGRUDAN baglanir - Arduino Uno/Nano
; ile yapilsaydi 5V -> 3.3V gerilim bolucu gerekirdi.

[env:flash_tester]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
build_flags = -DCORE_DEBUG_LEVEL=0
