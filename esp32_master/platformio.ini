[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; UART0 - Serial Monitor (GPIO3 RX, GPIO1 TX)
; UART1 - RS485 (GPIO16 RX, GPIO17 TX)

lib_deps =
    PubSubClient
    bblanchon/ArduinoJson @ ^6.19.0
    SPIFFS
    ; Onceki BLEDevice.h (Bluedroid, arduino-esp32 core'a gomulu) birkac
    ; baglan/kopar dongusunden sonra yeni baglantilari sessizce reddediyordu
    ; (telefon tarafinda "status=4 connection timeout") - bilinen bir Bluedroid
    ; zayifligi. NimBLE tekrarlayan baglan/kopar senaryolarinda cok daha
    ; kararli, ayrica flas/RAM ayak izi de kucuk.
    h2zero/NimBLE-Arduino @ ^1.4.1
    ; IR kumanda alicisi: IRremote kutuphanesi KULLANILMIYOR - protokol
    ; tanima/repeat-kare mantigi tekrar tekrar kararsizliga yol acti (bkz
    ; main.cpp "IR KUMANDA - HAM KENAR YAKALAMA" bolumu basindaki not) ve
    ; bu kartta LED-feedback pini yuzunden daha once brownout'a bile sebep
    ; olmustu. Yerine kutuphanesiz, attachInterrupt+micros() tabanli kendi
    ; ham kenar yakalama kodumuz kullaniliyor.
    ; MPPT sarj kontrolcusu (ikinci, ayri RS232 hatti uzerinden) PI30/
    ; Voltronic ASCII protokolu konusuyor - Modbus DEGIL, bu yuzden
    ; ModbusMaster kutuphanesine gerek yok (main.cpp kendi CRC16/komut
    ; gonderimini HardwareSerial uzerinde yapiyor, bkz mpptSendCommand()).

; default.csv 4MB'lik seride kaliyordu (app partition 1.31MB, BLE eklenince
; tasma riski vardi). 16MB varsayimi cihazi boot loop'a soktu (ROM seviyesinde
; surekli rst:0x3 RTC_SW_SYS_RST - partition tablosu gercek flash sinirini
; asinca bootloader kendini guvenlik icin resetliyor). PlatformIO'nun bu kart
; icin kendi varsayimi "N8, 8MB" oldugundan (bkz board json), guvenli tarafta
; kalmak icin karta ait gercek 8MB tablosuna donuldu - app partition yine de
; 1.31MB -> 3.34MB'a cikiyor, BLE'li derleme (1.61MB) rahat sigiyor.
;
; 2026-08-18: acilista goruntulenen "cop veri" bir donanim/PSRAM/flash sorunu
; SANILDI (16MB, octal/quad PSRAM denemeleri yapildi) - ama gercek sebep
; main.cpp'nin Serial.begin(9600) kullanmasiydi (monitor_speed=115200 ile
; uyusmuyordu), cihaz baslangictan beri saglikliydi. PSRAM/flash denemeleri
; gereksizdi, bilinen-iyi 8MB/dio/PSRAM'siz haline geri donuldu.
;
; 2026-08-26 DENEME: Kullanici kartin uzerindeki yaziya bakarak modulun
; ESP32-S3-N16R8 oldugunu bildirdi, 4d_systems_esp32s3_gen4_r8n16.json board
; tanimindaki (qio_opi + qio flash_mode + 16MB + BOARD_HAS_PSRAM) kombinasyonu
; denendi - AMA SAHADA TEKRAR AYNI BOOT LOOP'A yol acti (rst:0x3
; RTC_SW_SYS_RST, surekli). Yani bu KARTTA/modulde flash gercekten 16MB
; DEGIL (ya da QIO modunu desteklemiyor) - "N16R8" yazisi/beklentisi
; dogrulanamadi, GERI ALINDI. Bilinen-iyi 8MB/dio/PSRAM'siz haline don.
; TEKRAR DENENMEDEN ONCE: esptool ile `esptool.py flash_id` cikisindan
; gercek flash boyutunu okuyup DOGRULAYIN - varsayima dayanarak bir daha
; degistirmeyin.
board_build.partitions = default_8MB.csv
board_build.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

upload_protocol = esptool
monitor_port = COM6
upload_port = COM6

build_flags =
    -DCORE_DEBUG_LEVEL=0

; MAX3232 loopback (jumper) testi icin izole minimal firmware - normal
; src/main.cpp'yi HIC derlemeye katmiyor, bkz test/mppt_loopback_test.cpp
[env:mppt_loopback_test]
extends = env:esp32s3
build_src_filter = -<*> +<../test/mppt_loopback_test.cpp>

; RJ45/MPPT icindeki kopuklugu multimetre/osiloskopla elle takip etmek icin
; surekli 0x55 gonderen firmware, bkz test/mppt_tx_trace_test.cpp
[env:mppt_tx_trace_test]
extends = env:esp32s3
build_src_filter = -<*> +<../test/mppt_tx_trace_test.cpp>
