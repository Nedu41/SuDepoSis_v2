[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; UART0 - Serial Monitor (GPIO3 RX, GPIO1 TX)
; UART1 - RS485 (GPIO16 RX, GPIO17 TX)

lib_deps =
    PubSubClient
    bblanchon/ArduinoJson @ ^6.19.0
    SPIFFS
    ; Onceki BLEDevice.h (Bluedroid, arduino-esp32 core'a gomulu) birkac
    ; baglan/kopar dongusunden sonra yeni baglantilari sessizce reddediyordu
    ; (telefon tarafinda "status=4 connection timeout") - bilinen bir Bluedroid
    ; zayifligi. NimBLE tekrarlayan baglan/kopar senaryolarinda cok daha
    ; kararli, ayrica flas/RAM ayak izi de kucuk.
    h2zero/NimBLE-Arduino @ ^1.4.1
    ; IR kumanda alicisi: IRremote kutuphanesi KULLANILMIYOR - protokol
    ; tanima/repeat-kare mantigi tekrar tekrar kararsizliga yol acti (bkz
    ; main.cpp "IR KUMANDA - HAM KENAR YAKALAMA" bolumu basindaki not) ve
    ; bu kartta LED-feedback pini yuzunden daha once brownout'a bile sebep
    ; olmustu. Yerine kutuphanesiz, attachInterrupt+micros() tabanli kendi
    ; ham kenar yakalama kodumuz kullaniliyor.
    ; MPPT sarj kontrolcusunden (ikinci, ayri RS485 hatti uzerinden) aku
    ; voltaji okumak icin Modbus RTU master - HardwareSerial/Stream
    ; uzerinde calisir, yaygin/bakimli kutuphane.
    4-20ma/ModbusMaster @ ^2.0.1

; default.csv 4MB'lik seride kaliyordu (app partition 1.31MB, BLE eklenince
; tasma riski vardi). 16MB varsayimi cihazi boot loop'a soktu (ROM seviyesinde
; surekli rst:0x3 RTC_SW_SYS_RST - partition tablosu gercek flash sinirini
; asinca bootloader kendini guvenlik icin resetliyor). PlatformIO'nun bu kart
; icin kendi varsayimi "N8, 8MB" oldugundan (bkz board json), guvenli tarafta
; kalmak icin karta ait gercek 8MB tablosuna donuldu - app partition yine de
; 1.31MB -> 3.34MB'a cikiyor, BLE'li derleme (1.61MB) rahat sigiyor.
board_build.partitions = default_8MB.csv
board_build.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

upload_protocol = esptool
monitor_port = COM6
upload_port = COM6

build_flags =
    -DCORE_DEBUG_LEVEL=0
