; TANI TESTI - ana firmware'den tamamen izole, sadece NimBLE peripheral.
; Amac: ana firmware'de (WiFi/RS485/MQTT/SPIFFS) BLE baglantisini bloke eden
; bir sey mi var, yoksa sorun telefon/ortam tarafinda mi - bunu ayirt etmek.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1

board_build.partitions = default_8MB.csv
board_build.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

upload_protocol = esptool
monitor_port = COM6
upload_port = COM6

build_flags =
    -DCORE_DEBUG_LEVEL=0
